{% extends '../shared/layout.html' %}

{% block content %}
<div class="max-w-md mx-auto my-12 p-6 bg-white rounded-md shadow-md border border-gray-100 text-center">
  <h2 class="text-2xl font-bold text-gray-900 mb-2">Check Your Inbox</h2>
  <p class="text-sm text-gray-600 mb-6">
    We have sent a password reset link to your email address. If you don't receive an email within a few minutes, check your spam folder.
  </p>
  <a href="{% url 'account:login' %}" class="inline-block bg-black text-white text-sm font-medium px-6 py-2.5 rounded hover:bg-gray-800 transition-colors">
    Back to Login
  </a>
</div>
{% endblock %}
