<div class="space-y-6">
  <!-- Manage My Account Group -->
  <div class="space-y-2">
    <h3 class="font-medium text-black text-sm sm:text-base">Manage My Account</h3>
    <ul class="pl-6 space-y-2 text-xs sm:text-sm">
      <li>
        <a href="{% url 'mainsite:profile' %}" class="{% if active_tab == 'profile' %}text-[#DB4444] font-medium{% else %}text-gray-500 hover:text-black{% endif %} transition-colors">
          My Profile
        </a>
      </li>
      <li>
        <a href="{% url 'mainsite:address_book' %}" class="{% if active_tab == 'address_book' %}text-[#DB4444] font-medium{% else %}text-gray-500 hover:text-black{% endif %} transition-colors">
          Address Book
        </a>
      </li>
      <li>
        <a href="{% url 'mainsite:payment_options' %}" class="{% if active_tab == 'payment_options' %}text-[#DB4444] font-medium{% else %}text-gray-500 hover:text-black{% endif %} transition-colors">
          My Payment Options
        </a>
      </li>
    </ul>
  </div>

  <!-- My Orders Group -->
  <div class="space-y-2">
    <h3 class="font-medium text-black text-sm sm:text-base">My Orders</h3>
    <ul class="pl-6 space-y-2 text-xs sm:text-sm">
      <li>
        <a href="{% url 'mainsite:returns' %}" class="{% if active_tab == 'returns' %}text-[#DB4444] font-medium{% else %}text-gray-500 hover:text-black{% endif %} transition-colors">
          My Returns
        </a>
      </li>
      <li>
        <a href="{% url 'mainsite:cancellations' %}" class="{% if active_tab == 'cancellations' %}text-[#DB4444] font-medium{% else %}text-gray-500 hover:text-black{% endif %} transition-colors">
          My Cancellations
        </a>
      </li>
    </ul>
  </div>

  <!-- My WishList Group -->
  <div>
    <a href="{% url 'mainsite:wishlist' %}" class="font-medium text-black text-sm sm:text-base hover:text-[#DB4444] transition-colors">
      My WishList
    </a>
  </div>
