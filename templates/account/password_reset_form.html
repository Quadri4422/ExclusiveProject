{% extends '../shared/layout.html' %}

{% block content %}
<div class="max-w-md mx-auto my-12 p-6 bg-white rounded-md shadow-md border border-gray-100">
  <h2 class="text-2xl font-bold text-gray-900 mb-2">Reset Password</h2>
  <p class="text-sm text-gray-600 mb-6">Enter your registered email address to receive password reset instructions.</p>

  <form method="POST">
    {% csrf_token %}
    <div class="mb-4">
      <label for="id_email" class="block text-xs font-semibold text-gray-700 uppercase mb-1">Email Address</label>
      <input 
        type="email" 
        name="email" 
        id="id_email" 
        required 
        class="w-full bg-gray-100 rounded px-4 py-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-black"
        placeholder="example@domain.com"
      >
    </div>

    <button 
      type="submit" 
      class="w-full bg-[#DB4444] text-white font-medium py-3 rounded hover:bg-red-600 transition-colors"
    >
      Send Reset Link
    </button>
  </form>
</div>
{% endblock %}
